[package]
name = "scantoprint-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ScanToPrint server: customer portal, admin API, conversion and printing"

[lib]
name = "scantoprint_core"

[[bin]]
name = "dev-server"
path = "src/bin/dev-server.rs"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum-extra = { version = "0.10", features = ["cookie"] }
cookie = "0.18"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hex = "0.4"
if-addrs = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp"] }
lopdf = "0.46"
rand = "0.8"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
mime_guess = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["trace", "limit", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
