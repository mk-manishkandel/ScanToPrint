[workspace]
resolver = "3"
members = ["crates/core", "src-tauri"]

[workspace.package]
# Keep in sync with src-tauri/tauri.conf.json (checked by scripts/check-versions.mjs)
version = "0.1.14"
edition = "2024"
license = "MIT"
repository = "https://github.com/mk-manishkandel/ScanToPrint"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Unwind (not abort) so a panic while parsing a bad file fails one task, not the whole app.
panic = "unwind"
strip = true
